name: Build & Release APK

on:
  push:
    branches: [main]      # tiap push ke main: build + update release "latest" (tanpa perlu tag)
    paths-ignore:         # perubahan dokumentasi saja nggak perlu build ulang
      - '**.md'
      - '.gitignore'
    tags: ['v*']          # rilis resmi: git tag v1.0.0 && git push origin v1.0.0 (jarang dipakai)
  workflow_dispatch:      # atau jalankan manual dari tab Actions (hasilnya juga masuk release "latest")

permissions:
  contents: write

concurrency:              # push beruntun: build lama dibatalkan, yang terbaru saja yang jalan
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Tentukan versi
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="0.0.${GITHUB_RUN_NUMBER}-dev"
          fi
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Siapkan keystore (tanda tangan APK)
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            {
              echo "KEYSTORE_PASSWORD=$KS_PASS"
              echo "KEY_ALIAS=$KS_ALIAS"
              echo "KEY_PASSWORD=$KS_KEYPASS"
            } >> "$GITHUB_ENV"
          else
            keytool -genkeypair -keystore "$KS" -storepass kartu13build -keypass kartu13build \
              -alias kartu13 -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Kartu 13, O=Kartu13, C=ID"
            {
              echo "KEYSTORE_PASSWORD=kartu13build"
              echo "KEY_ALIAS=kartu13"
              echo "KEY_PASSWORD=kartu13build"
            } >> "$GITHUB_ENV"
            echo "::warning::Secret keystore belum diset. APK ditandatangani kunci sementara, jadi update antar-rilis nggak bisa menimpa versi lama. Lihat README bagian 'Tanda tangan'."
          fi
          echo "KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"

      - name: Verify AndroidX configuration
        run: |
          echo "Repository root: $(pwd)"
          echo "Gradle files:"
          ls -la
          if [ ! -f gradle.properties ]; then
            echo "ERROR: gradle.properties tidak ditemukan di root project"
            exit 1
          fi
          grep -n "^android.useAndroidX=" gradle.properties || true
          grep -q "^android.useAndroidX=true$" gradle.properties || {
            echo "ERROR: android.useAndroidX=true tidak ditemukan di gradle.properties root"
            exit 1
          }

      - name: Build APK release
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Ganti nama APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "Kartu13-${VERSION_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "Kartu13-latest.apk"   # nama tetap, buat link unduh yang stabil
          ls -la Kartu13-*.apk

      # Cadangan saja. Link artifact butuh login GitHub dan kadaluarsa, jadi unduh dari Releases.
      - uses: actions/upload-artifact@v4
        with:
          name: Kartu13-apk
          path: Kartu13-${{ env.VERSION_NAME }}.apk
          retention-days: 7

      # Build dari push ke main / manual: satu release "latest" yang ditimpa terus (cuma 1 tag, nggak numpuk)
      - name: Update release "latest"
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest Kartu13-latest.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Build terbaru (#${GITHUB_RUN_NUMBER})" \
            --notes "Build otomatis dari commit ${GITHUB_SHA::7}, versi ${VERSION_NAME}. Release ini ditimpa setiap push ke main."

      # Build dari tag v*: rilis resmi dengan nomor versi
      - name: Upload ke GitHub Release (tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Kartu13-${{ env.VERSION_NAME }}.apk
          generate_release_notes: true
